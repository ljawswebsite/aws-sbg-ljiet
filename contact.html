<body>
  <main>
    <section class="section" id="contact">
      <div class="container">
        <div class="sec-hdr">
          <span class="kicker">Contact</span>
          <h2>Have questions? Drop us a line.</h2>
        </div>
        <div class="contact-layout">

          <aside class="card contact-info">
            <h3>Visit our Cloud Lab</h3>
            <p>We welcome students from every branch and year. No prior AWS experience required — just curiosity and
              consistency.</p>
            <ul class="contact-list">
              <li>
                <div class="ci-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16v16H4z" />
                    <path d="m22 6-10 7L2 6" />
                  </svg></div>
                <div class="ci-text"><strong>Email</strong><a
                    href="mailto:awsclub@ljiet.edu.in">awsclub@ljiet.edu.in</a></div>
              </li>
              <li>
                <div class="ci-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0Z" />
                    <circle cx="12" cy="10" r="3" />
                  </svg></div>
                <div class="ci-text"><strong>Campus</strong><span>LJIET at LJ University</span></div>
              </li>
            </ul>
          </aside>

          <div class="card contact-form-wrap">
            <h3>Send us a message</h3>
            <form id="contactForm" novalidate>
              <div class="form-row">
                <div class="field">
                  <label for="name">Name</label>
                  <input id="name" name="name" type="text" placeholder="Your name" required>
                </div>
                <div class="field">
                  <label for="email">Email</label>
                  <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
              </div>
              <div class="field">
                <label for="interest">Interest</label>
                <input id="interest" name="interest" type="text" placeholder="Cloud, DevOps, AI/ML, Security, Web">
              </div>
              <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us what you want to build or learn."
                  required></textarea>
              </div>
              <button class="btn btn-primary" type="submit" style="width:100%;">Send Message</button>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
